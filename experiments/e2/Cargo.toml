[package]
name = "frame-trace-e2"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
codec = { package = "parity-scale-codec", version = "3.7.5", features = ["derive"] }
hex = "0.4"
hash-db = "0.16"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sc-executor = "=0.50.0"
sp-core = "=43.0.0"
sp-io = "=48.0.0"
sp-runtime = "=48.0.0"
sp-state-machine = "=0.53.0"
sp-trie = "=46.0.0"
sp-externalities = "=0.34.0"
sp-statement-store = "=28.0.0"
sp-crypto-ec-utils = { version = "=0.23.0", features = ["rfc163"] }
cumulus-primitives-proof-size-hostfunction = "=0.20.0"
tracing = "0.1"
tracing-core = "0.1"

[profile.dev]
debug = 0

[profile.release]
debug = 0
codegen-units = 256
