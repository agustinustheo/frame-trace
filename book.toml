[book]
authors = ["frame-trace contributors"]
language = "en"
src = "docs"
title = "frame-trace"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/agustinustheo/frame-trace"
edit-url-template = "https://github.com/agustinustheo/frame-trace/edit/main/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
