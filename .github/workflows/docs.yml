name: Documentation

on:
  push:
    branches: [main]
    paths:
      - book.toml
      - docs/**
      - mermaid.min.js
      - mermaid-init.js
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - book.toml
      - docs/**
      - mermaid.min.js
      - mermaid-init.js
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.0

      # Downloads a prebuilt binary instead of compiling it on every run.
      - name: Install mdBook
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: mdbook@0.4.52

      # mdbook-mermaid 0.16.0 has no prebuilt binary, so build it once and cache it.
      - name: Cache mdbook-mermaid
        id: mermaid-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook-mermaid
          key: mdbook-mermaid-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build mdbook-mermaid
        if: steps.mermaid-cache.outputs.cache-hit != 'true'
        run: cargo +1.93.0 install mdbook-mermaid --locked --version 0.16.0

      - name: Build documentation
        run: mdbook build

      # Deploying needs GitHub Pages enabled for the repository. Set the repository
      # variable DOCS_DEPLOY to "true" once it is; until then the book is only built.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: vars.DOCS_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
