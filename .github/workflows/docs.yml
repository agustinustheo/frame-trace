name: Documentation

on:
  push:
    branches: [main]
    paths:
      - book.toml
      - docs/**
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - book.toml
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      # Downloads a prebuilt binary instead of compiling it on every run.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52

      # mdbook-mermaid 0.16.0 has no prebuilt binary, so build it once and cache it.
      - name: Cache mdbook-mermaid
        id: mermaid-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/mdbook-mermaid
          key: mdbook-mermaid-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build mdbook-mermaid
        if: steps.mermaid-cache.outputs.cache-hit != 'true'
        run: cargo +1.93.0 install mdbook-mermaid --locked --version 0.16.0

      - name: Build documentation
        run: mdbook build

      # Deploying needs GitHub Pages enabled for the repository. Set the repository
      # variable DOCS_DEPLOY to "true" once it is; until then the book is only built.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: vars.DOCS_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
