# Grafana Tempo as a single binary with local storage. For a local machine only.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

# Make a new trace searchable about two seconds after frame-trace sends it.
# The defaults, which wait about 30 seconds, suit a busy cluster.
query_frontend:
  query_end_cutoff: 1s

live_store:
  flush_check_period: 1s
  max_trace_idle: 1s

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
