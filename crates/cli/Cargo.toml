[package]
name = "polkadot-frame-trace"
description = "OpenTelemetry traces of what a Polkadot SDK block did to storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["polkadot", "substrate", "opentelemetry", "tracing", "storage"]
categories = ["command-line-utilities", "development-tools::debugging", "development-tools::profiling", "cryptography::cryptocurrencies"]
include = ["/src/**/*.rs", "/LICENSE"]
publish = true

[[bin]]
name = "polkadot-frame-trace"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
comfy-table.workspace = true
polkadot-frame-trace-decode.workspace = true
polkadot-frame-trace-model.workspace = true
polkadot-frame-trace-replay.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }
rayon = "1"
polkadot-frame-trace-otel.workspace = true
serde_json.workspace = true
serde.workspace = true

[lints]
workspace = true
