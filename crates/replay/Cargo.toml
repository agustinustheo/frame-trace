[package]
name = "frame-trace-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
frame-trace-model.workspace = true
zstd = "0.13"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-util = "0.7"
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
sp-panic-handler = "13.0.2"
frame-metadata.workspace = true
sp-crypto-hashing.workspace = true
codec = { package = "parity-scale-codec", version = "3.7.5", features = ["derive"] }
hex.workspace = true
hash-db = "0.16"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sc-executor = "=0.51.0"
sp-core = "=43.0.0"
sp-io = "=49.0.0"
sp-runtime = "=49.0.0"
sp-state-machine = "=0.54.0"
sp-trie = "=47.0.0"
sp-externalities = "=0.34.0"
sp-statement-store = "=29.0.0"
sp-crypto-ec-utils = { version = "=0.24.0", features = ["rfc163"] }
cumulus-primitives-proof-size-hostfunction = "=0.21.0"
tracing = "0.1"
tracing-core = "0.1"

[lints]
workspace = true

[dev-dependencies]
tungstenite = "0.28"
wat = "1"
frame-trace-decode.workspace = true
