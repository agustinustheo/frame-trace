[package]
name = "frame-trace-otel"
description = "Turns frame-trace block traces into OpenTelemetry spans and exports them over OTLP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
frame-trace-decode.workspace = true
frame-trace-model.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-http = { version = "0.33.1", default-features = false, features = ["reqwest-blocking"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
async-trait = "0.1"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
frame-trace-replay.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
